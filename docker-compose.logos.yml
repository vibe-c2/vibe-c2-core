# Migration test: existing vibe-c2 data, Logos images.
#
# Runs the *published* images from the new `logos` org against the volumes this
# project already created, to prove the rebrand is a drop-in image swap. This
# file lives here, in the old project, on purpose — the Logos repos know
# nothing about vibe-c2.
#
#   docker compose -f docker-compose.yml down          # free the volumes + ports
#   docker compose -f docker-compose.logos.yml up -d
#   # browse https://localhost:8443
#
# Volumes are declared `external` under their existing names, so Compose
# attaches the real data instead of deriving new names from the project name.
# Nothing here writes to docker-compose.yml, so `down` on this file and `up` on
# the original rolls straight back.
#
# Expected, and covered in the rebrand notes:
#   - every session is invalidated (the JWT issuer changed) -> log in again
#   - AMQP topology is re-declared as logos.* ; the old vibe.* exchanges and
#     queues linger empty and can be deleted
#   - API/agent keys keep working once the holder swaps the prefix:
#     vc2_ -> lgs_ , vca_ -> lga_   (the prefix is not stored)
#   - infra credentials come from this project's .env and are NOT rebranded:
#     Mongo db/user, RabbitMQ user/cookie and the SeaweedFS key live inside
#     the volumes and must keep their current values
#
# SSO is out of scope: no keycloak_data volume exists in this deployment, so
# the keycloak service is omitted.

name: logos-migration

services:
  core:
    image: ghcr.io/logos/logos-core:${LOGOS_TAG:-latest}
    container_name: logos-mig-core
    restart: unless-stopped
    environment:
      APP_STAGE_STATUS: ${APP_STAGE_STATUS}
      APP_DEBUG: ${APP_DEBUG}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_ENABLED: ${CACHE_ENABLED}
      HOCUSPOCUS_URL: http://hocuspocus:1235
      HOCUSPOCUS_TICKET_SECRET: ${HOCUSPOCUS_TICKET_SECRET}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET}
      WIKI_AUTO_BACKUP_INTERVAL: ${WIKI_AUTO_BACKUP_INTERVAL:-30m}
      # SeaweedFS S3 — inside the compose network we must route through the
      # service name, not localhost (the host-side .env value is for CLIs).
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      # Community skill bundles. A distinct bucket means a distinct
      # SeaweedFS collection, and a collection's first write is when its
      # volume is allocated — point this at an existing bucket if the
      # cluster has no free volume slots to grow a new one.
      SKILL_BUCKET: ${SKILL_BUCKET:-skills}
      SKILL_MAX_SIZE: ${SKILL_MAX_SIZE:-10485760}
      WIKI_IMAGE_BUCKET: ${WIKI_IMAGE_BUCKET:-wiki-images}
      WIKI_IMAGE_MAX_SIZE: ${WIKI_IMAGE_MAX_SIZE:-10485760}
      WIKI_IMAGE_MAX_DIMENSION: ${WIKI_IMAGE_MAX_DIMENSION:-2560}
      WIKI_IMAGE_SWEEPER_INTERVAL: ${WIKI_IMAGE_SWEEPER_INTERVAL:-24h}
      WIKI_IMAGE_SWEEPER_GRACE: ${WIKI_IMAGE_SWEEPER_GRACE:-168h}
      # Wiki file attachments. These were documented in .env.example but
      # never listed here, so setting any of them had no effect and the
      # compiled defaults silently won.
      WIKI_FILE_BUCKET: ${WIKI_FILE_BUCKET:-wiki-files}
      WIKI_FILE_MAX_SIZE: ${WIKI_FILE_MAX_SIZE:-52428800}
      WIKI_FILE_DENIED_CONTENT_TYPES: ${WIKI_FILE_DENIED_CONTENT_TYPES:-}
      WIKI_FILE_SWEEPER_INTERVAL: ${WIKI_FILE_SWEEPER_INTERVAL:-24h}
      WIKI_FILE_SWEEPER_GRACE: ${WIKI_FILE_SWEEPER_GRACE:-168h}
      # The attachment garbage collector's master switch. .env.example
      # documents a four-step procedure for arming it; without these two
      # lines, steps three and four did nothing at all.
      WIKI_SWEEPER_ENABLED: ${WIKI_SWEEPER_ENABLED:-false}
      WIKI_SWEEPER_DRY_RUN: ${WIKI_SWEEPER_DRY_RUN:-true}
      # Wiki export/import jobs.
      WIKI_IMPORT_ZIP_MAX_SIZE: ${WIKI_IMPORT_ZIP_MAX_SIZE:-209715200}
      WIKI_TRANSFER_ARTIFACT_TTL: ${WIKI_TRANSFER_ARTIFACT_TTL:-24h}
      INSTALLATION_ID: ${INSTALLATION_ID:-}
      # Per-agent-key ceilings for the MCP surface.
      MCP_CALLS_PER_MINUTE: ${MCP_CALLS_PER_MINUTE:-120}
      MCP_WRITES_PER_MINUTE: ${MCP_WRITES_PER_MINUTE:-30}
      # Module heartbeat and reaper.
      MODULE_HEARTBEAT_INTERVAL: ${MODULE_HEARTBEAT_INTERVAL:-30s}
      MODULE_HEARTBEAT_GRACE_MISSES: ${MODULE_HEARTBEAT_GRACE_MISSES:-3}
      MODULE_REAPER_INTERVAL: ${MODULE_REAPER_INTERVAL:-15s}
      MODULE_REAPER_ENABLED: ${MODULE_REAPER_ENABLED:-true}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-168h}
      AUTH_REFRESH_GRACE_TTL: ${AUTH_REFRESH_GRACE_TTL:-10s}
      AUTH_CSRF_ENABLED: ${AUTH_CSRF_ENABLED:-true}
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      # OIDC / SSO — all optional; see .env.example. The dev Keycloak
      # (profile "sso") is reachable as keycloak.localhost:8180 from both the
      # browser and this container so the issuer URL is the same on both sides.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Keycloak}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-realm_access.roles}
      OIDC_ROLE_MAPPING: ${OIDC_ROLE_MAPPING:-vibec2-admin:admin,vibec2-user:user}
      OIDC_DEFAULT_ROLES: ${OIDC_DEFAULT_ROLES:-user}
      OIDC_USE_USERINFO: ${OIDC_USE_USERINFO:-true}
      OIDC_LINK_EXISTING_BY_USERNAME: ${OIDC_LINK_EXISTING_BY_USERNAME:-false}
      OIDC_HTTP_TIMEOUT: ${OIDC_HTTP_TIMEOUT:-10s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,https://localhost:8443}
      # RabbitMQ — a reachable broker is a hard startup dependency (core exits if
      # it can't connect). Inside the compose network we must route through the
      # service name, not localhost (the host-side .env value is for CLIs).
      APP_RABBITMQ_HOST: rabbitmq
      APP_RABBITMQ_PORT: "5672"
      APP_RABBITMQ_VHOST: ${APP_RABBITMQ_VHOST:-/}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logos

  frontend:
    image: ghcr.io/logos/logos-frontend:${LOGOS_TAG:-latest}
    container_name: logos-mig-frontend
    restart: unless-stopped
    networks:
      - logos

  hocuspocus:
    image: ghcr.io/logos/logos-hocuspocus:${LOGOS_TAG:-latest}
    container_name: logos-mig-hocuspocus
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      HOCUSPOCUS_TICKET_SECRET: ${HOCUSPOCUS_TICKET_SECRET}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET}
      HOCUSPOCUS_WEBHOOK_URL: http://core:8002/api/v1/internal/wiki/webhook
      HOCUSPOCUS_DEBOUNCE_MS: ${HOCUSPOCUS_DEBOUNCE_MS:-2000}
      MAX_ACTIVE_ROOMS: ${MAX_ACTIVE_ROOMS:-100}
      MAX_CLIENTS_PER_ROOM: ${MAX_CLIENTS_PER_ROOM:-20}
      # The internal HTTP API binds PORT+1 (1235), which core calls above.
      PORT: 1234
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - logos

  nginx:
    image: nginx:alpine
    container_name: logos-mig-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx/logos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/dev-certs:/etc/nginx/certs:ro
    depends_on:
      - core
      - frontend
      - hocuspocus
    networks:
      - logos

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logos-mig-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos

  mongodb:
    image: mongo:7
    container_name: logos-mig-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos

  redis:
    image: redis:7-alpine
    container_name: logos-mig-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: logos-mig-seaweedfs-master
    restart: unless-stopped
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0
    volumes:
      - seaweedfs_master_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: logos-mig-seaweedfs-volume
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080
    volumes:
      - seaweedfs_volume_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    networks:
      - logos

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: logos-mig-seaweedfs-filer
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0
    volumes:
      - seaweedfs_filer_data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    networks:
      - logos

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: logos-mig-seaweedfs-s3
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
    depends_on:
      - seaweedfs-filer
    networks:
      - logos

# The data this test exists to prove: the volumes docker-compose.yml created
# under the "vibe-c2-core" project name. `external` means Compose attaches them
# as-is and never creates or deletes them.
volumes:
  rabbitmq_data:
    external: true
    name: vibe-c2-core_rabbitmq_data
  mongodb_data:
    external: true
    name: vibe-c2-core_mongodb_data
  redis_data:
    external: true
    name: vibe-c2-core_redis_data
  seaweedfs_master_data:
    external: true
    name: vibe-c2-core_seaweedfs_master_data
  seaweedfs_filer_data:
    external: true
    name: vibe-c2-core_seaweedfs_filer_data
  seaweedfs_volume_data:
    external: true
    name: vibe-c2-core_seaweedfs_volume_data

networks:
  logos:
    driver: bridge
